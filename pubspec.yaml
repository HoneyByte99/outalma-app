name: outalma_app
description: "Outalma : service marketplace MVP"
publish_to: 'none'

version: 1.0.0+33

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.0
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4
  firebase_crashlytics: ^4.1.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  # Renders the illustrated avatar catalogue. Needed rather than raster assets
  # because the skin tone is recoloured at RUN time through ColorMapper: in PNG
  # it would take one file per character AND per tone, about 180 instead of 40.
  flutter_svg: ^2.3.0
  connectivity_plus: ^6.1.0
  flutter_native_splash: ^2.4.3

  # Maps
  google_maps_flutter: ^2.10.0
  http: ^1.2.2
  record: ^5.2.1
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  table_calendar: ^3.1.2
  intl: ^0.20.2

  # App
  meta: ^1.17.0
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  geolocator: ^14.0.2
  geolocator_web: ^4.1.3
  url_launcher: ^6.3.1
  app_links: ^6.3.2
  share_plus: ^10.1.4
  audio_session: ^0.1.25
  # Identity capture (archi C2): camera provides the frames and the JPEG from
  # takePicture(); ML Kit face detection drives the light liveness challenge.
  # google_mlkit_document_scanner is deliberately NOT used (archi E2): it is
  # Android-only, so it cannot guarantee identical document framing on iOS. The
  # framing is a home-grown visual template plus a Dart sharpness check instead.
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.14.0
  # On-device text recognition (archi E2 extension): before a document still is
  # accepted, a readable-text check refuses frames that carry no text at all (a
  # wall, a hand, a cow), which the sharpness gate alone cannot catch. It never
  # reads or stores the text; only "some text is present" gates the capture.
  google_mlkit_text_recognition: ^0.16.0

dependency_overrides:
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^3.0.3
  mocktail: ^1.0.4
  geolocator_platform_interface: ^4.2.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon_cropped.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_icon_cropped.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/images/logo_icon_cropped.png"
    background_color: "#ffffff"
    theme_color: "#1B3A4B"

flutter_native_splash:
  color: "#F4F7F9"
  image: assets/images/logo_icon_cropped.png
  color_dark: "#F4F7F9"
  image_dark: assets/images/logo_icon_cropped.png
  android_12:
    color: "#F4F7F9"
    image: assets/images/logo_icon_cropped.png
    color_dark: "#F4F7F9"
    image_dark: assets/images/logo_icon_cropped.png
  web: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    # Per-directory, like assets/images/ above: adding an avatar never touches
    # this file again. Only *.svg live there; the licence sits in
    # docs/avatars-licence.md so it is not bundled for nothing.
    - assets/avatars/
    - docs/legal/
